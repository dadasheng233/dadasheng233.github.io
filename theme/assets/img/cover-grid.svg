<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="网格纸上的浏览器线框与彩色渐变">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f4ec"/><stop offset="1" stop-color="#e8e2d6"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f79533"/><stop offset=".24" stop-color="#ef4e7b"/>
      <stop offset=".48" stop-color="#a166ab"/><stop offset=".7" stop-color="#5073b8"/><stop offset="1" stop-color="#07b39b"/>
    </linearGradient>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f79533" stop-opacity=".55"/><stop offset="1" stop-color="#f79533" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a166ab" stop-opacity=".5"/><stop offset="1" stop-color="#a166ab" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#07b39b" stop-opacity=".45"/><stop offset="1" stop-color="#07b39b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0v34" fill="none" stroke="#16161a" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer>
    </filter>
    <clipPath id="c"><rect width="1200" height="675"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="675" fill="url(#paper)"/>
    <rect width="1200" height="675" fill="url(#grid)"/>
    <circle cx="300" cy="160" r="220" fill="url(#blob1)" filter="url(#blur)"/>
    <circle cx="960" cy="180" r="220" fill="url(#blob2)" filter="url(#blur)"/>
    <circle cx="920" cy="560" r="240" fill="url(#blob3)" filter="url(#blur)"/>
    <path d="M0 92h1200" stroke="url(#rainbow)" stroke-width="2" opacity=".55"/>
    <g transform="translate(170 138)">
      <rect x="8" y="10" width="860" height="440" rx="12" fill="#1a1a20" opacity=".08"/>
      <rect width="860" height="440" rx="12" fill="#fffdf8" stroke="#1a1a20" stroke-width="2.5"/>
      <path d="M0 56h860" stroke="#1a1a20" stroke-width="2.5"/>
      <circle cx="28" cy="28" r="6" fill="#ef4e7b"/><circle cx="50" cy="28" r="6" fill="#f79533"/><circle cx="72" cy="28" r="6" fill="#07b39b"/>
      <rect x="106" y="18" width="310" height="20" rx="10" fill="#f3eee4"/>
      <path d="M440 18h180" stroke="#d8d0c3" stroke-width="2" stroke-dasharray="6 6"/>
      <g>
        <rect x="40" y="92" width="300" height="26" rx="4" fill="#1a1a20"/>
        <rect x="40" y="136" width="230" height="12" rx="6" fill="#c9c1b4"/>
        <rect x="40" y="160" width="270" height="12" rx="6" fill="#ded7cb"/>
        <rect x="40" y="184" width="190" height="12" rx="6" fill="#ded7cb"/>
        <rect x="40" y="228" width="126" height="38" rx="19" fill="url(#rainbow)"/>
        <rect x="184" y="228" width="112" height="38" rx="19" fill="none" stroke="#1a1a20" stroke-width="2"/>
      </g>
      <g>
        <rect x="440" y="92" width="380" height="220" rx="8" fill="#f5f0e7" stroke="#1a1a20" stroke-width="2"/>
        <circle cx="630" cy="202" r="72" fill="url(#rainbow)" opacity=".92"/>
        <circle cx="602" cy="182" r="18" fill="#fff" opacity=".38"/>
        <path d="m486 272 72-90 48 54 42-38 92 74Z" fill="#fffdf8" opacity=".32"/>
      </g>
      <g>
        <rect x="440" y="334" width="112" height="76" rx="6" fill="none" stroke="#1a1a20" stroke-width="2"/>
        <rect x="534" y="334" width="112" height="76" rx="6" fill="none" stroke="#1a1a20" stroke-width="2"/>
        <rect x="628" y="334" width="112" height="76" rx="6" fill="none" stroke="#1a1a20" stroke-width="2"/>
        <rect x="722" y="334" width="98" height="76" rx="6" fill="none" stroke="#1a1a20" stroke-width="2"/>
      </g>
      <path d="M40 408h300" stroke="#ded7cb" stroke-width="2"/>
      <path d="M40 424h220" stroke="#ded7cb" stroke-width="2"/>
    </g>
    <g transform="translate(1020 468) rotate(6)">
      <rect x="-92" y="-64" width="184" height="128" rx="12" fill="#fffdf8" stroke="#1a1a20" stroke-width="2"/>
      <circle cx="-54" cy="-26" r="14" fill="#f79533"/>
      <path d="M-78 28h74M-78 44h48" stroke="#cfc7ba" stroke-width="5" stroke-linecap="round"/>
      <path d="M48-8 72 18" stroke="#1a1a20" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(66 520) rotate(-7)">
      <rect x="-34" y="-34" width="68" height="68" rx="12" fill="#1a1a20"/>
      <path d="m-13 0 9 10L15-12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g font-family="Consolas, monospace" font-size="18" fill="#1a1a20" opacity=".55">
      <text x="72" y="96">.grid</text><text x="1080" y="110">12 col</text><text x="60" y="620">build / 2026</text>
    </g>
    <rect width="1200" height="675" filter="url(#noise)" opacity=".55"/>
    <rect x="20" y="20" width="1160" height="635" fill="none" stroke="#1a1a20" stroke-opacity=".12"/>
  </g>
</svg>
