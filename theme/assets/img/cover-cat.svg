      <stop offset=".45" stop-color="#5073b8" stop-opacity=".17"/>
      <stop offset="1" stop-color="#5073b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f79533" stop-opacity=".25"/>
      <stop offset="1" stop-color="#f79533" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142b3a"/>
      <stop offset="1" stop-color="#0a1722"/>
