<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="晨光中层叠的山峦与一个小小的猫影">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2945"/><stop offset=".34" stop-color="#715b79"/>
      <stop offset=".58" stop-color="#d9857c"/><stop offset=".76" stop-color="#f3b179"/><stop offset="1" stop-color="#f8d9a2"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffbe8"/><stop offset=".36" stop-color="#ffe9ad" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffce7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b5a70"/><stop offset="1" stop-color="#3c3549"/>
    </linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b4058"/><stop offset="1" stop-color="#282537"/>
    </linearGradient>
    <linearGradient id="m3" x1="0" y1="0" x2="0" y2="1">
